<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オンラインビンゴ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffd23f,#17140b);--paper:light-dark(#fffdf6,#262113);--ink:light-dark(#1d1b16,#f7f0da);--mute:light-dark(#6b6350,#b8ad8c);--red:#e5352b;--line:light-dark(#e7dcc0,#3d3622);--soft:light-dark(#fff3c4,#3a3218)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 "M PLUS Rounded 1c",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(48px,env(safe-area-inset-bottom))}
h1{font:400 28px/1.1 "Dela Gothic One",sans-serif;margin:0 0 4px;text-align:center}
.sub{text-align:center;color:var(--mute);font-size:14px;margin:0 0 18px}
.sub button{margin-left:6px}
.note{text-align:center;font-size:14px;background:var(--paper);border-radius:12px;padding:10px 14px;margin:0 0 16px}
.note:empty{display:none}
.stage{display:grid;place-items:center;padding:8px 0 18px}
.ball{width:min(56vw,210px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0 18%,#f4f1e8 45%,#d9d3c3 100%);box-shadow:0 18px 0 -8px rgba(0,0,0,.18),inset 0 -10px 24px rgba(0,0,0,.12);display:grid;place-items:center;position:relative;color:#1d1b16}
.ball::before{content:"";position:absolute;inset:10%;border-radius:50%;border:6px solid var(--red)}
.ball .lt{position:absolute;top:21%;font:400 clamp(16px,5vw,22px)/1 "Dela Gothic One";color:var(--red)}
.ball .nm{font:400 clamp(54px,18vw,86px)/1 "Dela Gothic One";margin-top:10%;font-variant-numeric:tabular-nums}
.ball.roll{animation:wob .12s linear infinite}
@keyframes wob{50%{transform:rotate(4deg) translateY(-3px)}}
.ball.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.count{margin-top:14px;font-weight:800;font-size:15px}
.box{background:var(--paper);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.box h2{font-size:15px;font-weight:800;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btns{display:grid;gap:10px}
button{font:800 17px/1.2 "M PLUS Rounded 1c",sans-serif;min-height:52px;border-radius:14px;border:0;cursor:pointer;padding:10px 16px;color:#fff;background:var(--red);box-shadow:0 4px 0 #a5221a}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a5221a}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.big{min-height:72px;font-size:22px}
button.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line);min-height:44px;font-size:15px}
button.mini{min-height:32px;font-size:13px;padding:4px 10px;border-radius:99px}
button.warn{background:#1d1b16;box-shadow:0 4px 0 #000}
button:disabled{opacity:.5;cursor:default}
label{display:block;font-weight:800;margin:0 0 6px}
input{width:100%;font:500 18px/1.3 "M PLUS Rounded 1c",sans-serif;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:light-dark(#fff,#1b180f);color:var(--ink);margin-bottom:14px}
.hint{font-size:13px;color:var(--mute);margin:-6px 0 14px}
.winners{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.winners li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--soft)}
.winners li.me{outline:2px solid var(--red)}
.winners li.ng{opacity:.6;text-decoration:line-through}
.winners b{font-family:"Dela Gothic One";font-weight:400;color:var(--red);min-width:2.4em}
.winners .nm{overflow-wrap:anywhere}
.winners small{margin-left:auto;color:var(--mute);white-space:nowrap;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.hd{background:var(--red);color:#fff;font:400 clamp(20px,6vw,28px)/1 "Dela Gothic One";text-align:center;padding:8px 0;border-radius:10px}
.cell{aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);border-radius:12px;font:400 clamp(22px,7vw,32px)/1 "Dela Gothic One";position:relative;font-variant-numeric:tabular-nums}
.cell.hit::after{content:"";position:absolute;inset:9%;border-radius:50%;background:var(--red);opacity:.8;animation:stamp .3s ease-out}
.cell.hit span{position:relative;z-index:1;color:#fff}
.cell.free{font:800 clamp(13px,3.6vw,16px)/1 "M PLUS Rounded 1c"}
.cell.inline{border-color:var(--red);background:var(--soft)}
.cell.reach{border-color:var(--red);border-style:dashed}
@keyframes stamp{0%{transform:scale(1.6);opacity:0}100%{transform:scale(1)}}
.tag{font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--line);white-space:nowrap}
.tag.on{background:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:400 15px/1 "Dela Gothic One";padding:8px 10px;border-radius:99px;background:var(--line);white-space:nowrap}
.chip:first-child{background:var(--red);color:#fff}
.empty{color:var(--mute);font-size:14px}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(229,53,43,.94);z-index:9;color:#fff;text-align:center;padding:24px}
.over.show{display:grid}
.over p{font:400 clamp(56px,18vw,120px)/1 "Dela Gothic One";margin:0}
.toasts{position:fixed;left:0;right:0;top:max(12px,env(safe-area-inset-top));display:grid;gap:8px;justify-items:center;z-index:8;pointer-events:none;padding:0 12px}
.toast{background:#1d1b16;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:tin .3s ease-out;max-width:100%;overflow-wrap:anywhere}
.toast em{font-style:normal;color:#ffd23f}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.ball.roll,.ball.pop,.cell.hit::after,.toast{animation:none}}
</style>
</head>
<body>
<div class="toasts" id="toasts"></div>
<div class="wrap">
  <h1>オンラインビンゴ</h1>
  <p class="sub" id="role">接続しています…</p>
  <div class="note" id="note"></div>

  <!-- 参加者：名前登録 -->
  <form class="box" id="joinForm" hidden>
    <h2>参加登録</h2>
    <label for="nameIn">お名前（表示名）</label>
    <input id="nameIn" maxlength="20" autocomplete="nickname" placeholder="例：山田 太郎" required>
    <p class="hint">ビンゴしたとき、この名前が全員の画面に表示されます（20文字まで）</p>
    <button class="big" type="submit" style="width:100%" id="joinBtn">参加する</button>
  </form>

  <!-- 主催者：ログイン -->
  <form class="box" id="loginForm" hidden>
    <h2>主催者ログイン</h2>
    <label for="mailIn">メールアドレス</label>
    <input id="mailIn" type="email" autocomplete="username" required>
    <label for="passIn">パスワード</label>
    <input id="passIn" type="password" autocomplete="current-password" required>
    <button class="big" type="submit" style="width:100%">ログイン</button>
  </form>

  <div id="game" hidden>
    <div class="stage">
      <div class="ball" id="ball"><span class="lt" id="ballL"></span><span class="nm" id="ballN">–</span></div>
      <div class="count" id="count">まだ抽選されていません</div>
      <button class="ghost mini" id="soundBtn" style="margin-top:10px" aria-pressed="true">効果音：オン</button>
      <p class="empty" id="soundHint" style="margin:6px 0 0;font-size:13px" hidden>スマホは一度画面をタップすると音が鳴るようになります</p>
    </div>

    <section class="box" id="hostBox" hidden>
      <h2><span>主催者パネル</span><span><span class="tag" id="players">参加 0人</span> <span class="tag" id="stTag">待機中</span></span></h2>
      <div class="btns">
        <button class="big" id="drawBtn">次の番号を抽選</button>
        <button id="startBtn">ビンゴを開始する</button>
        <button class="ghost" id="resetBtn">新しいゲームにする（カードを配り直し）</button>
      </div>
    </section>

    <section class="box">
      <h2><span>ビンゴした人</span><span class="tag" id="winN">0人</span></h2>
      <ul class="winners" id="winners"></ul>
    </section>

    <section class="box" id="cardBox" hidden>
      <h2><span>あなたのカード</span><span><span class="tag" id="reachTag">リーチ 0</span> <span class="tag" id="bingoTag">ビンゴ 0</span></span></h2>
      <div class="grid" id="card"></div>
      <p class="empty" id="cardMsg" style="margin:10px 0 0;text-align:center">抽選された番号は自動でマークされます</p>
    </section>

    <section class="box">
      <h2><span>これまでの番号</span><span class="empty">新しい順</span></h2>
      <div class="chips" id="chips"></div>
    </section>
  </div>
</div>
<div class="over" id="over"><div><p>BINGO!</p><div style="font-weight:800;font-size:18px;margin-top:12px" id="overMsg"></div><div style="font-size:14px;margin-top:18px;opacity:.85">画面をタップして閉じる</div></div></div>

<script type="module">
// ===== ここに Firebase の設定を貼り付けてください（README 参照）=====
const CONFIG = {
  apiKey: "AIzaSyCIdnz7wZ9Z4d7SnU2SqqcqMkQa5q3XPZE",
  authDomain: "bingoapp-f7cf1.firebaseapp.com",
  projectId: "bingoapp-f7cf1",
  appId: "1:144257234049:web:da3666705be26492948980"
};
// =====================================================================

const $ = id => document.getElementById(id);
const L = 'BINGO';
const DEMO = CONFIG.apiKey.startsWith('YOUR');
const HOST = location.hash === '#host';
let api, uid = null, myName = '';
let S = { round: '', status: 'waiting', drawn: [] }, claims = [], nPlayers = 0;
let prevLen = -1, gotState = false, gotClaims = false, announced = new Set(), myBingoShown = false, claimBusy = false, busy = false, resetArm = null;

// ---------- カード生成（uid とゲームIDから必ず同じカードになる） ----------
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeCard(seed){const r=rng(hash(seed)),cols=[];for(let c=0;c<5;c++){const p=[];for(let n=c*15+1;n<=c*15+15;n++)p.push(n);for(let i=p.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}cols.push(p.slice(0,5))}cols[2][2]=0;return cols}
const LINES=(()=>{const a=[],k=[0,1,2,3,4];for(let i=0;i<5;i++){a.push(k.map(j=>[i,j]));a.push(k.map(j=>[j,i]))}a.push(k.map(j=>[j,j]));a.push(k.map(j=>[j,4-j]));return a})();
const letter = n => L[Math.floor((n-1)/15)];
function score(card, set){
  const hit=(c,r)=>card[c][r]===0||set.has(card[c][r]);let bingo=0,reach=0;const inLine=new Set(),reachCell=new Set();
  for(const ln of LINES){const n=ln.filter(([c,r])=>hit(c,r)).length;
    if(n===5){bingo++;ln.forEach(([c,r])=>inLine.add(c+','+r))}
    else if(n===4){reach++;ln.forEach(([c,r])=>{if(!hit(c,r))reachCell.add(c+','+r)})}}
  return {hit,bingo,reach,inLine,reachCell};
}
// 何個目の番号で初めてビンゴになったか（0 = まだ）
function firstBingoAt(card, drawn){const s=new Set();for(let i=0;i<drawn.length;i++){s.add(drawn[i]);if(i>=3&&score(card,s).bingo)return i+1}return 0}
// 申告が本当に正しいかを全員の端末で検証
function verify(c){
  if(!c||c.round!==S.round||!S.round)return false;
  const k=Number(c.drawCount);if(!Number.isInteger(k)||k<4||k>S.drawn.length)return false;
  return firstBingoAt(makeCard(c.uid+'|'+c.round),S.drawn)===k;
}
const ms = t => t ? (typeof t.toMillis==='function'?t.toMillis():Number(t)) : Date.now();
const cleanName = s => String(s||'').replace(/\s+/g,' ').trim().slice(0,20);

// ---------- 画面描画 ----------
function setNote(t){$('note').textContent=t}
function toast(name){const d=document.createElement('div');d.className='toast';const e=document.createElement('em');e.textContent=name+' さん';d.append(e,' がビンゴ！');$('toasts').append(d);setTimeout(()=>d.remove(),4500)}

function render(){
  const d=S.drawn, playing=S.status==='playing';
  $('count').textContent=d.length?`${d.length}個目 ／ 残り${75-d.length}個`:(playing?'まもなく最初の抽選です':'まだ抽選されていません');
  $('chips').innerHTML=d.length?d.slice().reverse().map(n=>`<span class="chip">${letter(n)}-${n}</span>`).join(''):'<span class="empty">抽選が始まると表示されます</span>';

  // 参加者のカード
  if(!HOST && uid){
    const card=makeCard(uid+'|'+S.round), sc=score(card,new Set(d));
    let h=[...L].map(x=>`<div class="hd">${x}</div>`).join('');
    for(let r=0;r<5;r++)for(let c=0;c<5;c++){const v=card[c][r],k=c+','+r;
      h+=`<div class="${['cell',v===0?'free':'',sc.hit(c,r)?'hit':'',sc.inLine.has(k)?'inline':'',sc.reachCell.has(k)?'reach':''].join(' ')}"><span>${v===0?'FREE':v}</span></div>`}
    $('card').innerHTML=h;
    $('reachTag').textContent='リーチ '+sc.reach;$('reachTag').className='tag'+(sc.reach?' on':'');
    $('bingoTag').textContent='ビンゴ '+sc.bingo;$('bingoTag').className='tag'+(sc.bingo?' on':'');
    const mine=claims.find(c=>c.uid===uid&&c.round===S.round);
    if(sc.bingo&&playing){
      if(!mine&&!claimBusy){claimBusy=true;
        api.claim({round:S.round,name:myName,drawCount:firstBingoAt(card,d)})
          .then(()=>{$('cardMsg').textContent='ビンゴ！ 全員の画面にあなたの名前が表示されます'})
          .catch(()=>{claimBusy=false;$('cardMsg').textContent='ビンゴの送信に失敗しました。通信状況を確認してください'});}
      if(!myBingoShown&&prevLen>=0){myBingoShown=true;$('overMsg').textContent=myName+' さん、おめでとうございます！';$('over').classList.add('show')}
      myBingoShown=true;
    }
  }

  // ビンゴした人（検証済みのみ全員に表示。主催者には不正な申告も表示）
  const list=claims.filter(c=>c.round===S.round&&S.round).map(c=>({...c,ok:verify(c)}))
    .filter(c=>c.ok||HOST).sort((a,b)=>(b.ok-a.ok)||(a.drawCount-b.drawCount)||(ms(a.at)-ms(b.at)));
  const ul=$('winners');ul.innerHTML='';let rank=0,prev=null;
  list.forEach((c,i)=>{if(c.ok&&c.drawCount!==prev){rank=i+1;prev=c.drawCount}
    const li=document.createElement('li');if(c.uid===uid)li.className='me';if(!c.ok)li.className='ng';
    const b=document.createElement('b');b.textContent=c.ok?rank+'位':'不正';
    const nm=document.createElement('span');nm.className='nm';nm.textContent=cleanName(c.name)||'参加者';
    const sm=document.createElement('small');sm.textContent=c.ok?c.drawCount+'個目でビンゴ':'カードと一致しません';
    li.append(b,nm,sm);ul.append(li)});
  const okN=list.filter(c=>c.ok).length;
  $('winN').textContent=okN+'人';$('winN').className='tag'+(okN?' on':'');
  if(!list.length)ul.innerHTML='<li class="empty" style="background:none;padding:0">まだいません</li>';

  // 新しくビンゴした人をトースト通知（読み込み直後の既存分は通知しない）
  if(gotState&&gotClaims){
    for(const c of list){if(!c.ok)continue;const key=S.round+'|'+c.uid;
      if(!announced.has(key)){announced.add(key);if(prevLen>=0&&c.uid!==uid)toast(cleanName(c.name)||'参加者')}}
  }

  // 主催者パネル
  const showHost=HOST||DEMO;
  $('hostBox').hidden=!showHost;
  if(showHost){
    $('players').textContent='参加 '+nPlayers+'人';
    $('stTag').textContent=playing?'開催中':'待機中';$('stTag').className='tag'+(playing?' on':'');
    $('startBtn').hidden=playing;$('drawBtn').hidden=!playing;
    $('drawBtn').disabled=busy||d.length>=75;
    $('drawBtn').textContent=d.length>=75?'全75個 抽選済み':'次の番号を抽選';
  }
  $('role').textContent=HOST?'主催者画面':
    (DEMO?'デモモード（この端末だけで動作中）':(playing?'ビンゴ開催中！':'主催者が開始するまでお待ちください'));
  if(!HOST&&myName){const b=document.createElement('button');b.className='ghost mini';b.textContent='名前を変更';b.onclick=()=>showJoin(true);$('role').append(' ／ '+myName+' さん',b)}
}

function unlockAudio(){
  try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C()}
    if(ac.state==='suspended')ac.resume();
    loadSfx();
    $('soundHint').hidden=true;
    const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0); // iOS解除用の無音
  }catch(e){}
}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('keydown',unlockAudio);
let noiseBuf=null,bus=null;
const ROLL=2.52; // 効果音の最後の「ジャーン」までの秒数（ここで番号が出る）
function noise(){if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function out(){if(!bus){const c=ac.createDynamicsCompressor();c.threshold.value=-20;c.ratio.value=8;c.attack.value=.002;bus=ac.createGain();bus.gain.value=.45;bus.connect(c).connect(ac.destination)}return bus}
function snare(t,v){ // スネア1打：響き線のノイズ＋胴鳴り
  const n=ac.createBufferSource();n.buffer=noise();
  const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200;
  const pk=ac.createBiquadFilter();pk.type='peaking';pk.frequency.value=3500;pk.gain.value=6;
  const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);
  n.connect(hp).connect(pk).connect(g).connect(out());n.start(t,Math.random()*1.5);n.stop(t+.1);
  const o=ac.createOscillator(),og=ac.createGain();o.type='triangle';
  o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(170,t+.05);
  og.gain.setValueAtTime(v*.5,t);og.gain.exponentialRampToValueAtTime(.001,t+.06);
  o.connect(og).connect(out());o.start(t);o.stop(t+.07);
}
function kick(t,v){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';
  o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.35);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g).connect(out());o.start(t);o.stop(t+.55)}
function crash(t,v){ // シンバル：高域ノイズ＋金属的な倍音
  const n=ac.createBufferSource();n.buffer=noise();
  const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=4500;
  const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(v*.35,t+.25);g.gain.exponentialRampToValueAtTime(.001,t+2.2);
  n.connect(hp).connect(g).connect(out());n.start(t);n.stop(t+2.3);
  const mg=ac.createGain();mg.gain.setValueAtTime(v*.05,t);mg.gain.exponentialRampToValueAtTime(.001,t+1.6);
  const bp=ac.createBiquadFilter();bp.type='highpass';bp.frequency.value=3000;bp.connect(mg).connect(out());
  [3150,4370,5280,6910,8130].forEach(f=>{const o=ac.createOscillator();o.type='square';o.frequency.value=f;o.connect(bp);o.start(t);o.stop(t+1.7)});
}
// 効果音ファイル（ドラムロール）を埋め込み。読めなかったときは合成音で代用
let sfxBuf=null,sfxLoading=false;
function loadSfx(){
  if(sfxBuf||sfxLoading||!ac)return;sfxLoading=true;
  try{const bin=atob(SFX_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    ac.decodeAudioData(u.buffer,b=>{sfxBuf=b},()=>{sfxLoading=false})}catch(e){sfxLoading=false}
}
function playRoll(len){
  if(!soundOn||!ac||ac.state!=='running')return;
  if(sfxBuf){const src=ac.createBufferSource();src.buffer=sfxBuf;src.connect(ac.destination);src.start(ac.currentTime+.02);return}
  const t0=ac.currentTime+.03;
  // ドラロール：左右の手で細かく連打（約30打/秒）、だんだん大きく
  let t=0,i=0;
  while(t<len){const k=t/len;const v=(.12+.5*k*k)*(i%2?.85:1)*(0.9+Math.random()*.2);
    snare(t0+t,v);t+=.033+(Math.random()-.5)*.006;i++}
  // ジャーン！：シンバル＋バスドラ＋スネアのアクセント
  const tj=t0+len;crash(tj,.5);kick(tj,.7);snare(tj,.6);
}
function renderSoundBtn(){$('soundBtn').textContent=soundOn?'効果音：オン':'効果音：オフ';$('soundBtn').setAttribute('aria-pressed',soundOn)}
$('soundBtn').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('bingoSound',soundOn?'on':'off')}catch(e){}unlockAudio();renderSoundBtn()};
renderSoundBtn();

function showBall(animate){
  const n=S.drawn[S.drawn.length-1],ball=$('ball');
  if(!n){$('ballL').textContent='';$('ballN').textContent='–';render();return}
  if(!animate){$('ballL').textContent=letter(n);$('ballN').textContent=n;render();return}
  playRoll(ROLL);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){setTimeout(()=>{$('ballL').textContent=letter(n);$('ballN').textContent=n;render()},ROLL*1000);return}
  ball.classList.remove('pop');ball.classList.add('roll');let t=0;
  const iv=setInterval(()=>{const x=1+Math.floor(Math.random()*75);$('ballL').textContent=letter(x);$('ballN').textContent=x;
    if(++t>=Math.round(ROLL*1000/70)){clearInterval(iv);ball.classList.remove('roll');void ball.offsetWidth;ball.classList.add('pop');$('ballL').textContent=letter(n);$('ballN').textContent=n;render()}},70);
}
function onState(s){
  s=s||{};
  const round=typeof s.round==='string'?s.round:'';
  const changed=round!==S.round;
  S={round,status:s.status==='playing'?'playing':'waiting',drawn:Array.isArray(s.drawn)?s.drawn.filter(n=>Number.isInteger(n)&&n>=1&&n<=75):[]};
  if(changed){myBingoShown=false;claimBusy=false;$('over').classList.remove('show');$('cardMsg').textContent='抽選された番号は自動でマークされます'}
  const grew=gotState&&!changed&&S.drawn.length>prevLen;
  if(!gotState){gotState=true;showBall(false);prevLen=-1;render();}
  else showBall(grew);
  prevLen=S.drawn.length;
}
function onClaims(list){claims=list;gotClaims=true;render()}

// ---------- 画面の切り替え ----------
function showJoin(edit){$('game').hidden=true;$('joinForm').hidden=false;$('nameIn').value=edit?myName:'';$('nameIn').focus()}
function startGame(){
  $('joinForm').hidden=true;$('loginForm').hidden=true;$('game').hidden=false;$('cardBox').hidden=HOST;
  $('soundHint').hidden=!!(ac&&ac.state==='running');
  if(!startGame.done){startGame.done=true;
    const t=setTimeout(()=>setNote('接続に時間がかかっています…'),10000);
    api.watchState(s=>{clearTimeout(t);setNote('');onState(s)},()=>setNote('データを読み込めませんでした。ページを開き直してください'));
    api.watchClaims(onClaims,()=>{});
    if(HOST||DEMO)api.watchPlayers(n=>{nPlayers=n;render()},()=>{});
  }
  render();
}
$('joinForm').onsubmit=async e=>{
  e.preventDefault();const n=cleanName($('nameIn').value);if(!n)return;
  $('joinBtn').disabled=true;
  try{await api.saveName(n);myName=n;
    const mine=claims.find(c=>c.uid===uid&&c.round===S.round);
    if(mine)await api.claim({round:mine.round,name:n,drawCount:mine.drawCount});
    startGame();
  }catch(err){setNote('登録できませんでした。通信状況を確認してもう一度お試しください')}
  $('joinBtn').disabled=false;
};
$('loginForm').onsubmit=async e=>{
  e.preventDefault();
  try{await api.login($('mailIn').value.trim(),$('passIn').value);setNote('');startGame()}
  catch(err){setNote('ログインできませんでした。メールアドレスとパスワードを確認してください')}
};
$('over').onclick=()=>$('over').classList.remove('show');

// ---------- 主催者の操作 ----------
const failWrite=()=>setNote('保存できませんでした。主催者アカウントでログインしているか確認してください');
$('startBtn').onclick=()=>api.setState({round:S.round||('r'+Date.now()),status:'playing',drawn:S.drawn}).catch(failWrite);
$('drawBtn').onclick=async()=>{
  if(busy)return;const rest=[];for(let n=1;n<=75;n++)if(!S.drawn.includes(n))rest.push(n);if(!rest.length)return;
  busy=true;render();
  const n=rest[Math.floor(Math.random()*rest.length)];
  try{await api.setState({round:S.round,status:'playing',drawn:[...S.drawn,n]})}catch(e){failWrite()}
  setTimeout(()=>{busy=false;render()},ROLL*1000+400);
};
$('resetBtn').onclick=async()=>{
  const b=$('resetBtn'),label='新しいゲームにする（カードを配り直し）';
  if(!resetArm){b.textContent='もう一度押すとリセット（全員のカードが変わります）';b.className='warn';resetArm=setTimeout(()=>{resetArm=null;b.textContent=label;b.className='ghost'},4000);return}
  clearTimeout(resetArm);resetArm=null;b.textContent=label;b.className='ghost';
  api.setState({round:'r'+Date.now(),status:'waiting',drawn:[]}).catch(failWrite);
};

// ---------- データ接続 ----------
async function firebaseApi(){
  const V='https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp},A,F]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
  const app=initializeApp(CONFIG),auth=A.getAuth(app),db=F.getFirestore(app);
  let user=await new Promise(res=>{const un=A.onAuthStateChanged(auth,u=>{un();res(u)})});
  if(!HOST&&!user)user=(await A.signInAnonymously(auth)).user;
  return {
    user,
    async login(mail,pass){const c=await A.signInWithEmailAndPassword(auth,mail,pass);return c.user},
    watchState:(cb,err)=>F.onSnapshot(F.doc(db,'game','state'),s=>cb(s.data()),err),
    watchClaims:(cb,err)=>F.onSnapshot(F.collection(db,'claims'),q=>cb(q.docs.map(d=>({uid:d.id,...d.data()}))),err),
    watchPlayers:(cb,err)=>F.onSnapshot(F.collection(db,'players'),q=>cb(q.size),err),
    setState:s=>F.setDoc(F.doc(db,'game','state'),s),
    saveName:n=>F.setDoc(F.doc(db,'players',auth.currentUser.uid),{name:n,at:F.serverTimestamp()}),
    async getMyName(){const s=await F.getDoc(F.doc(db,'players',auth.currentUser.uid));return s.exists()?s.data().name:''},
    claim:c=>F.setDoc(F.doc(db,'claims',auth.currentUser.uid),{round:c.round,name:c.name,drawCount:c.drawCount,at:F.serverTimestamp()})
  };
}
function demoApi(){
  let st={round:'demo',status:'waiting',drawn:[]},cl=[],cbS=()=>{},cbC=()=>{};
  const uidLocal='demo-user';
  return {user:{uid:uidLocal,isAnonymous:true},async login(){return{uid:'host'}},
    watchState(cb){cbS=cb;setTimeout(()=>cb({...st}),0)},watchClaims(cb){cbC=cb;setTimeout(()=>cb([...cl]),0)},watchPlayers(cb){cb(1)},
    async setState(s){st=s;setTimeout(()=>cbS({...st}),0)},async saveName(){},async getMyName(){return''},
    async claim(c){cl=cl.filter(x=>x.uid!==uidLocal);cl.push({...c,uid:uidLocal,at:Date.now()});setTimeout(()=>cbC([...cl]),0)}};
}

try{
  api=DEMO?demoApi():await firebaseApi();
  if(DEMO)setNote('Firebase の設定前なので、この端末だけで試せるデモモードです');
  if(HOST){
    if(api.user&&!api.user.isAnonymous)startGame();else{$('loginForm').hidden=false;$('role').textContent='主催者画面'}
  }else{
    uid=api.user.uid;
    myName=cleanName(await api.getMyName());
    if(myName)startGame();else{showJoin(false);$('role').textContent='お名前を登録して参加してください'}
  }
}catch(e){console.error(e);setNote('接続できませんでした。通信状況を確認してページを開き直してください')}
</script>
